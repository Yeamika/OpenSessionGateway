[package]
name = "core"
version.workspace = true
edition.workspace = true
license.workspace = true

# Crate name `core` shadows `::core` (std library) in rustdoc doctest scope.
# The `async_trait` macro expands to `::core::pin`, `::core::future`, etc.
# which resolve to *this* crate instead of the standard library, causing
# doctest compilation failures.  Disable doctests until the crate is renamed
# to something that doesn't collide (e.g. `gv-core`).
[lib]
doctest = false

## Feature flags
##
## - `pingora-transport` — enables the Pingora-backed transport adapter
##   (`transport::pingora`). When off, core compiles without `pingora-core`,
##   `tokio-tungstenite`, or `futures-util`, and only ships with
##   `InMemoryTransport` for testing.
[features]
default = []
pingora-transport = ["pingora-core", "tokio-tungstenite", "futures-util"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
futures-util = { workspace = true, optional = true }
pingora-core = { version = "0.8.0", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
osgp.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt"] }
tokio-tungstenite = { workspace = true, optional = true }
tracing.workspace = true
