[package]
name = "glassvein-demos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# ── Demo showcase binaries ──
[[bin]]
name = "observer-demo"
path = "observer-demo.rs"

[[bin]]
name = "control-demo"
path = "control-demo.rs"

[[bin]]
name = "ws-client-demo"
path = "ws-client-demo.rs"

[dependencies]
anyhow.workspace = true
osgp-client.workspace = true
futures-util = "0.3"
router.workspace = true
serde_json.workspace = true
osgp.workspace = true
surface.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["connect"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true

[features]
default = []
pingora-listener = ["router/pingora-listener"]
