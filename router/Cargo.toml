[package]
name = "router"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
gv-core.workspace = true
pingora-core = { version = "0.8.0", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
osgp.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt", "rt-multi-thread", "net", "time", "signal"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true

[features]
default = []
## Enable the Pingora-backed listener stub (`connection::pingora_listener`).
##
## When active, `gv-core/pingora-transport` is also enabled, which pulls in
## `pingora-core`, `tokio-tungstenite`, and `futures-util`. The stub module
## only provides type declarations and a `PingoraLinkAcceptor` contract — it
## does **not** change `start_listener` behaviour yet. That wiring belongs to
## Phase C.
pingora-listener = ["gv-core/pingora-transport", "pingora-core"]
