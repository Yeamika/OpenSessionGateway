[workspace]

[package]
name = "osgp-rust-endpoint-example"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
osgp = { path = "../../osgp/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
