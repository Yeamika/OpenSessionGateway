[workspace]
resolver = "2"
members = [
  "crates/glassvein-protocol",
  "crates/glassvein-core",
  "crates/glassvein-router",
  "crates/glassvein-router-cli",
  "crates/glassvein-pingora",
  "examples/tree-demo",
  "examples/surface-demo",
  "examples/pingora-surface-demo",
  "examples/multi-upstream-demo",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.19", features = ["v4", "serde"] }
pingora-core = "0.8.0"
pingora-proxy = "0.8.0"
pingora-load-balancing = "0.8.0"
