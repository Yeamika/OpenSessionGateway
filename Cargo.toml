[workspace]
resolver = "2"
members = [
  # ── OSGP protocol ──
  "osgp/rust",                  # osgp (was session-links)

  # ── Client SDK ──
  "clients/rust",               # osgp-client (was clientlib + clientroute)

  # ── Core chain ──
  "core",                       # core (routing primitives)
  "router",                     # router runtime

  # ── Endpoint crates ──
  "endpoints/console",          # console-endpoint (replaces control/viewer)
  "endpoints/requestion",       # requestion-endpoint
  "endpoints/session-control",  # session-control-endpoint
  "endpoints/mailbox",          # mailbox-endpoint
  "endpoints/im",                 # im-endpoint
  "endpoints/timer",              # timer-endpoint

  # ── Surface library ──
  "crates/surface",

  # ── Demos ──
  "demos/alpha-client",
  "demos/beta-client",
  "demos/gamma-client",
  "demos/bash-clientdummy",
  "demos",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt", "sync"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
uuid = { version = "1.19", features = ["v4", "serde"] }
tempfile = "3"

# ── Workspace path deps ──
osgp = { path = "osgp/rust" }
osgp-client = { path = "clients/rust" }
core = { path = "core" }
gv-core = { path = "core", package = "core" }
router = { path = "router" }
surface = { path = "crates/surface" }
console-endpoint = { path = "endpoints/console" }
requestion-endpoint = { path = "endpoints/requestion" }
session-control-endpoint = { path = "endpoints/session-control" }
im-endpoint = { path = "endpoints/im" }

mailbox-endpoint = { path = "endpoints/mailbox" }
